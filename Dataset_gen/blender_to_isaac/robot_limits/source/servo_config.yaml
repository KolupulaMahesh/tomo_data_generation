###############################################
# Modify all parameters related to servoing here
###############################################

# Optionally override Servo's internal velocity scaling when near singularity or collision (0.0 = use internal velocity scaling)
override_velocity_scaling_factor: 0.5 # valid range [0.0:1.0]

## Properties of outgoing commands
publish_period: 0.03333  # 1/Nominal publish rate [seconds]
max_expected_latency: 0.1  # delay between sending a command and the robot executing it [seconds]

incoming_command_timeout: 0.3 # seconds

## MoveIt properties
enable_groups: [true, true, true, true, true]

move_group_names:
  - "left_arm"
  - "right_arm"
  - "head"
  - "left_fingers"
  - "right_fingers"

command_out_topics:
  - /tomo_left_arm_controller/joint_trajectory
  - /tomo_right_arm_controller/joint_trajectory
  - /tomo_head_controller/joint_trajectory
  - /tomo_left_hand_controller/joint_trajectory
  - /tomo_right_hand_controller/joint_trajectory

## Plugins for smoothing outgoing commands
use_smoothings: [true, true, true, true, true]
# current supported filter names: ButterworthFilter or AccelerationLimited
smoothing_filter_names:
  - "AccelerationLimited"
  - "AccelerationLimited"
  - "AccelerationLimited"
  - "AccelerationLimited"
  - "AccelerationLimited"

## Collision checking for the entire robot body
check_collisions: [false, false, false, false, false]
collision_check_rate: 30.0
self_collision_proximity_thresholds: [0.001, 0.001, 0.01, 0.001, 0.001]  # Start decelerating when a self-collision is this far [m]
scene_collision_proximity_thresholds: [0.001, 0.001, 0.05, 0.005, 0.005]  # Start decelerating when a scene collision is this far [m]

# Added as a buffer to joint variable position bounds [in that joint variable's respective units].
# If moving quickly, make these values larger.
joint_limit_margins: [0.01, 0.01, 0.01, 0.01, 0.01]

## Topic names
pose_command_in_topic: /pose_target_cmds # Topic for incoming pose commands
cartesian_command_in_topic: /delta_twist_cmds  # Topic for incoming Cartesian twist commands
joint_jog_command_in_topic: /delta_joint_jog_cmds  # Topic for incoming joint angle commands
joint_pos_command_in_topic: /delta_joint_pos_cmds  # Topic for incoming joint angle commands

enable_pose_commands: [true, true, true, true, true]
enable_cartesian_commands: [true, true, true, true, true]
enable_joint_jog_commands: [true, true, true, true, true]
enable_joint_pos_commands: [true, true, true, true, true]

execute_direct_joint_pos: true

joint_topic: /joint_states  # Get joint states from this tpoic
status_topic: /status  # Publish status to this topic

command_in_type: "speed_units"  # "unitless"> in the range [-1:1], as if from joystick. "speed_units"> cmds are in m/s and rad/s
scale:
  # Scale parameters are only used if command_in_type=="unitless"
  linear:  0.25  # Max linear velocity. Unit is [m/s]. Only used for Cartesian commands.
  rotational:  2.5  # Max angular velocity. Unit is [rad/s]. Only used for Cartesian commands.
  # Max joint angular/linear velocity. Only used for joint commands on joint_command_in_topic.
  joint: 2.5

# What type of topic does your robot driver expect?
# Currently supported are std_msgs/Float64MultiArray or trajectory_msgs/JointTrajectory
command_out_type: trajectory_msgs/JointTrajectory

# What to publish? Can save some bandwidth as most robots only require positions or velocities
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

# If is_primary_planning_scene_monitor is set to true, the Servo server's PlanningScene advertises the /get_planning_scene service,
# which other nodes can use as a source for information about the planning environment.
# NOTE: If a different node in your system is responsible for the "primary" planning scene instance (e.g. the MoveGroup node),
# then is_primary_planning_scene_monitor needs to be set to false.
is_primary_planning_scene_monitor: false
check_octomap_collisions: false  # Check collision against the octomap (if a 3D sensor plugin is available)

## Configure handling of singularities and joint limits
lower_singularity_threshold: 100.0  # Start decelerating when the condition number hits this (close to singularity)
hard_stop_singularity_threshold: 300.0  # Stop when the condition number hits this
leaving_singularity_threshold_multiplier: 20.0  # Multiply the hard stop limit by this when leaving singularity (see https://github.com/moveit/moveit2/pull/620)